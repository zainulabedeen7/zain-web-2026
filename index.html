<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zain's Full Portfolio Tool</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <!-- CSS Section (Design) -->
    <style>
        body {
            background-color: #f5f6fa;
            color: #2f3640;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card, .form-box, .calc-box, .clock-box, .game-box {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00a8ff;
            margin-bottom: 15px;
        }
        h1 { color: #2f3640; font-size: 32px; margin: 5px 0; }
        p { color: #718093; font-size: 18px; }
        
        /* Instagram Style */
        .social-icons { margin-top: 20px; }
        .social-icons a { color: #718093; font-size: 40px; text-decoration: none; display: inline-block; transition: 0.3s; }
        .social-icons a:hover { color: #e1306c; transform: scale(1.15); }

        /* ⏱️ Clock Styling */
        .clock-box h2 { color: #2f3640; margin-top: 0; }
        .clock-display {
            font-size: 36px;
            font-weight: bold;
            color: #00a8ff;
            background-color: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            letter-spacing: 2px;
            display: inline-block;
            min-width: 200px;
        }

        /* ❌⭕ Tic-Tac-Toe Game Styling */
        .game-box h2 { color: #2f3640; margin-top: 0; }
        .status-text { font-size: 18px; font-weight: bold; color: #00a8ff; margin-bottom: 15px; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 0 auto;
        }
        .cell {
            height: 80px;
            background-color: #f1f2f6;
            border: none;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background-color: #dcdde1; }
        .reset-btn {
            margin-top: 20px;
            background-color: #ee5253;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: 0.2s;
        }
        .reset-btn:hover { background-color: #c8d6e5; color: #2f3640; }

        /* 🧮 Calculator Styling */
        .calc-box h2 { color: #2f3640; margin-top: 0; }
        .calc-screen {
            width: 100%;
            height: 50px;
            background-color: #2f3640;
            color: white;
            text-align: right;
            padding: 10px;
            font-size: 24px;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 15px; font-size: 18px; font-weight: bold; background-color: #f1f2f6; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .calc-btn:hover { background-color: #dcdde1; }
        .calc-btn.operator { background-color: #ff9f43; color: white; }
        .calc-btn.operator:hover { background-color: #ee5253; }
        .calc-btn.clear { background-color: #74b9ff; color: white; }
        .calc-btn.clear:hover { background-color: #0984e3; }

        /* Form Styling */
        .form-box { text-align: left; }
        .form-box h2 { text-align: center; color: #2f3640; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #353b48; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .form-control:focus { border-color: #00a8ff; outline: none; }
        .submit-btn { background-color: #00a8ff; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .submit-btn:hover { background-color: #0097e6; }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            body { padding: 20px 10px; }
            .card, .form-box, .calc-box, .clock-box, .game-box { padding: 20px; }
            h1 { font-size: 24px; }
            p { font-size: 15px; }
            .profile-pic { width: 120px; height: 120px; }
            .submit-btn { font-size: 16px; }
            .calc-btn { padding: 10px; font-size: 16px; }
            .clock-display { font-size: 28px; }
            .cell { height: 65px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Profile Card -->
        <div class="card">
            <img src="my-photo.png" alt="Zain's Photo" class="profile-pic">
            <h1>Mera Dell Gen 11 PC</h1>
            <p>Main ne apni website me Tic-Tac-Toe Game, Live Digital Clock aur Calculator ko perfectly jor liya hai!</p>
            
            <!-- Instagram Link -->
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank" title="Follow Me on Instagram">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">

                    </svg>
                </a>
            </div>
        </div>

        <!-- ⏱️ Live Digital Clock Section -->
        <div class="clock-box">
            <h2>Live Digital Clock</h2>
            <div id="clock" class="clock-display">00:00:00 PM</div>
        </div>

        <!-- ❌⭕ Tic-Tac-Toe Game Box -->
        <div class="game-box">
            <h2>Zain's Tic-Tac-Toe</h2>
            <div class="status-text" id="gameStatus">Player X ki baari hai</div>
            
            <div class="game-grid">
                <button class="cell" onclick="playTurn(this, 0)"></button>
                <button class="cell" onclick="playTurn(this, 1)"></button>
                <button class="cell" onclick="playTurn(this, 2)"></button>
                <button class="cell" onclick="playTurn(this, 3)"></button>
                <button class="cell" onclick="playTurn(this, 4)"></button>
                <button class="cell" onclick="playTurn(this, 5)"></button>
                <button class="cell" onclick="playTurn(this, 6)"></button>
                <button class="cell" onclick="playTurn(this, 7)"></button>
                <button class="cell" onclick="playTurn(this, 8)"></button>
            </div>
            
            <button class="reset-btn" onclick="resetGame()">Game Reset Karein</button>
        </div>

        <!-- 🧮 Calculator Box Section -->
        <div class="calc-box">
            <h2>Zain's Magic Calculator</h2>
            <input type="text" id="display" class="calc-screen" readonly placeholder="0">
            <div class="calc-buttons">
                <button class="calc-btn clear" onclick="clearScreen()">C</button>
                <button class="calc-btn operator" onclick="pressKey('/')">/</button>
                <button class="calc-btn operator" onclick="pressKey('*')">*</button>
                <button class="calc-btn operator" onclick="pressKey('-')">-</button>
                <button class="calc-btn" onclick="pressKey('7')">7</button>
                <button class="calc-btn" onclick="pressKey('8')">8</button>
                <button class="calc-btn" onclick="pressKey('9')">9</button>
                <button class="calc-btn operator" onclick="pressKey('+')">+</button>
                <button class="calc-btn" onclick="pressKey('4')">4</button>
                <button class="calc-btn" onclick="pressKey('5')">5</button>
                <button class="calc-btn" onclick="pressKey('6')">6</button>
                <button class="calc-btn operator" onclick="calculateResult()">=</button>
                <button class="calc-btn" onclick="pressKey('1')">1</button>
                <button class="calc-btn" onclick="pressKey('2')">2</button>
                <button class="calc-btn" onclick="pressKey('3')">3</button>
                <button class="calc-btn" onclick="pressKey('0')">0</button>
            </div>
